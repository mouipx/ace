name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: app/**/*.gradle*

      - name: Build bridge, app, and run tests
        working-directory: app
        run: .\gradlew.bat build --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Package Ace Windows installer
        working-directory: app
        run: .\gradlew.bat packageExe --stacktrace

      - name: Upload application artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ace-windows
          path: |
            app/build/compose/binaries/main/exe/*.exe
            app/build/libs/*.jar
            app/build/native/bridge/rawaccel_bridge.dll
          if-no-files-found: error
